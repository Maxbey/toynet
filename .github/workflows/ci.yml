name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            directory: .
            go_mod: go.mod
            go_sum: go.sum
          - name: benchmarks
            directory: benchmarks
            go_mod: benchmarks/go.mod
            go_sum: benchmarks/go.sum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: ${{ matrix.go_sum }}
      - run: go test ./...
        working-directory: ${{ matrix.directory }}

  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            directory: .
            go_mod: go.mod
            config: .golangci.yml
          - name: benchmarks
            directory: benchmarks
            go_mod: benchmarks/go.mod
            config: ../.golangci.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.directory }}
          args: --config=${{ matrix.config }}
